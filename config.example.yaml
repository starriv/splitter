# splitter 示例配置
#
# 该文件用于本地运行、`make check-config` 与 `splitter -check`。生产配置应由部署系统
# 按实际环境生成，并以只读方式挂载到容器内的 /etc/splitter/config.yaml。
#
# 配置分为监听、管理端点、日志、资源限制、可观测性、上游组、域名集合与有序规则八部分：
#   - listen / admin 仅允许回环地址；
#   - upstreams 的服务器地址必须为 IP 字面量；
#   - rules 自上而下求值，首条命中生效，最后一条必须覆盖所有剩余查询。

listen:
  - 127.0.0.1:5335

# 指标、健康检查、路由诊断、JSON API 与控制面板。仅绑定回环地址。
admin: 127.0.0.1:9198

# 经反向代理以主机名访问管理端点时，在此列出该主机名（不含端口与协议）。
# IP 字面量与 localhost 始终允许；其他 Host 请求头一律拒绝，用于防御 DNS rebinding。
# admin_hosts: [dns-admin.example]

log:
  level: info
  # 向标准错误逐条输出查询（info 级别）。与下方查询日志相互独立。
  queries: false
  # 日志目录，省略时为 /var/log/splitter。相对路径按本文件所在目录解析。
  # 查询日志开启时，该目录无法创建或不可写则拒绝启动。
  dir: /var/log/splitter
  # 查询日志：应答过的每条查询（含本地拒绝的无效查询）以 JSON Lines 写入 dir，
  # 控制面板「最近查询」从这里分页读取。
  query_log:
    enabled: true
    # 全部查询日志文件的总上限（MiB），超出后从最旧的文件开始删除。
    max_size_mb: 4096
    # 保留时长（30 天），超过的文件被删除。
    max_age: 720h

limits:
  # 同时处理的查询数上限，取值 1–16384；超限查询被丢弃并计入 splitter_overload_dropped_total。
  max_inflight: 1024
  # 客户端 TCP 连接数上限；超限连接立即重置。
  max_tcp_conns: 256
  # 客户端 TCP 连接的空闲超时。
  tcp_idle_timeout: 10s
  # 热加载时集合条目允许的最大收缩比例，用于拒绝被截断的列表。
  max_set_shrink: 0.5

# 可观测性页（可选）：从 Prometheus 读回 splitter 自己的指标，按 Grafana 的口径
# 画成曲线。未配置时页面只显示启用方法，不发出任何请求。
# 修改后热加载即可生效，不需要重启。
# observability:
#   prometheus_url: http://127.0.0.1:9090
#   job: splitter
#   dashboard_url: https://grafana.example/d/dns-quality/
#   timeout: 8s

upstreams:
  # 示例：一组区域解析器与一组公共解析器。实际部署按网络环境配置。
  domestic:
    servers: ["223.5.5.5:53"]
    timeout: 2s
  international:
    servers: ["1.1.1.1:53"]
    timeout: 2s

sets:
  # 本地域：由本服务应答，不转发至任何上游。
  local:
    rules: ["domain:local.example"]
  # 域名集合：由列表文件构建；文件路径相对于配置文件所在目录。
  domestic:
    files: ["cn-domains.txt"]

rules:
  # 本地域规则：A 查询返回下方地址，其他类型返回 NODATA，并设置 AA 位。
  # ttl 省略时为 60；设为 0 表示应答不可缓存。
  - name: local-zone
    sets: [local]
    answer:
      a: ["192.0.2.10"]
      ttl: 60
  # 命中域名集合的查询转发到 domestic 上游组。
  - name: domestic
    sets: [domestic]
    forward: domestic
  # 默认规则：必须存在且位于最后，覆盖所有剩余查询。
  - name: default
    forward: international
