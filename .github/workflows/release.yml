name: release

# Publishes a release when a v* tag is pushed:
#   1. runs the full test suite, so every release corresponds to a commit that
#      passes it;
#   2. cross-compiles linux/amd64, linux/arm64, darwin/amd64 and darwin/arm64
#      binaries, generates sha256sums.txt and creates the GitHub Release;
#   3. builds a linux/amd64 + linux/arm64 image and pushes it to
#      ghcr.io/<owner>/splitter and, when Docker Hub credentials are configured,
#      to docker.io. Tags: <version>, <major>.<minor>, <major>, and latest. A
#      pre-release (a tag containing "-", such as v1.1.0-rc.1) receives only
#      <version>. After the push, every tag is verified to resolve to the same
#      image as <version>.
#
# Repository configuration for Docker Hub (optional; skipped with a warning when
# absent):
#   secrets.DOCKERHUB_USERNAME, secrets.DOCKERHUB_TOKEN   push credentials
#   vars.DOCKERHUB_REPOSITORY                             defaults to <owner>/splitter
#
# Publishing runs only on github.com; a mirror of this repository on another
# forge does not publish.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test

  github-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: build binaries and checksums
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            make build-platform GOOS="${target%/*}" GOARCH="${target#*/}" \
              VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA::12}"
          done
          cp LICENSE bin/LICENSE
          (cd bin && sha256sum splitter-* > sha256sums.txt)
          ls -l bin
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/splitter', github.repository_owner) }}
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "## Container images"
            echo
            echo '```'
            echo "ghcr.io/${owner}/splitter:${version}"
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "docker.io/${DOCKERHUB_REPOSITORY}:${version}"
            fi
            echo '```'
            echo
            echo "## Binaries"
            echo
            echo "linux/amd64, linux/arm64, darwin/amd64 and darwin/arm64 binaries are attached;"
            echo "verify them with \`sha256sum -c sha256sums.txt\`."
            echo
            echo "## Install with Go"
            echo
            echo '```'
            echo "go install github.com/${GITHUB_REPOSITORY}/cmd/splitter@${tag}"
            echo '```'
          } > notes.md
          prerelease=()
          case "${tag}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${tag}" bin/splitter-* bin/sha256sums.txt bin/LICENSE \
            --verify-tag --title "splitter ${version}" --notes-file notes.md \
            --generate-notes "${prerelease[@]}"

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/splitter', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7
      - name: build metadata
        id: build
        run: echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "image=docker.io/${DOCKERHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; the image is published to ghcr.io only"
          fi
      - if: steps.dockerhub.outputs.image != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/splitter
            ${{ steps.dockerhub.outputs.image }}
          # latest is listed explicitly instead of relying on the automatic
          # flavor, so the rule is visible here: every release except a
          # pre-release also moves latest. semver patterns other than
          # {{version}} are skipped for pre-releases by the action.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=splitter
            org.opencontainers.image.licenses=GPL-3.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.build.outputs.commit }}
      - name: verify published tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Every published tag must resolve to the same manifest as its
          # repository's <version> tag; latest in particular must be identical.
          digest() { docker buildx imagetools inspect --raw "$1" | sha256sum | cut -d' ' -f1; }
          status=0
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            pinned="${ref%:*}:${VERSION}"
            if [ "$(digest "${ref}")" = "$(digest "${pinned}")" ]; then
              echo "ok   ${ref} = ${pinned}"
            else
              echo "::error::${ref} does not resolve to the same image as ${pinned}"; status=1
            fi
          done <<< "${TAGS}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docker run --rm "ghcr.io/${owner}/splitter:${VERSION}" -version
          exit "${status}"
